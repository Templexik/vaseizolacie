<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#4B5A3E">
<title>Stránka sa nenašla — Vaše izolácie</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F1EEE5;--ink:#2A2822;--ink-soft:#55503F;--moss:#4B5A3E;--clay:#9C5B34;--clay-dark:#7E4A29;--cream:#FBF9F3;--line:rgba(42,40,34,0.14);--radius:3px;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif;font-size:17px;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:24px;}
  main{max-width:520px;text-align:center;}
  img{height:56px;width:auto;margin-bottom:28px;}
  .code{font-family:'Fraunces',serif;font-weight:600;font-size:96px;line-height:1;color:var(--moss);margin:0;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;margin:12px 0 10px;}
  p{color:var(--ink-soft);margin:0 0 28px;}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn-primary{background:var(--clay);color:var(--cream);padding:14px 24px;border-radius:var(--radius);text-decoration:none;font-weight:600;font-size:15.5px;}
  .btn-primary:hover{background:var(--clay-dark);}
  .btn-ghost{padding:14px 22px;border-radius:var(--radius);border:1.5px solid var(--line);text-decoration:none;font-weight:600;font-size:15.5px;color:var(--ink);}
  a:focus-visible{outline:3px solid var(--moss);outline-offset:3px;}
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="Roman Richter — Vaše izolácie, logo">
  <p class="code" aria-hidden="true">404</p>
  <h1>Táto stránka sa nenašla.</h1>
  <p>Adresa možno neexistuje alebo bola presunutá. Vráťte sa na hlavnú stránku, prípadne nám rovno zavolajte.</p>
  <div class="actions">
    <a class="btn-primary" href="/">Späť na hlavnú stránku</a>
    <a class="btn-ghost" href="tel:+421918509159">Zavolať</a>
  </div>
</main>
</body>
</html>
